spring:
  application:
    name: servicecare
  profiles:
    active: dev
  jackson:
    time-zone: Europe/Paris
server:
  port: 8080
springdoc:
  swagger-ui:
    path: /swagger
  api-docs:
    path: /v3/api-docs
app:
  uploads:
    dir: ${user.dir}/uploads
    max-size-bytes: 10485760
    allowed-content-types:
      - image/png
      - image/jpeg
      - application/pdf
    blocked-extensions:
      - .exe
      - .bat
      - .cmd
      - .sh
      - .js
      - .jar