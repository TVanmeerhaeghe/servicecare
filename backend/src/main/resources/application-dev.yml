spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:${MYSQL_HOST:localhost}}:${DB_PORT:${MYSQL_PORT:3306}}/${DB_NAME:servicecare}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASS:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        "[format_sql]": true
  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:1f5a3c8e0d7b9f6c4a2d1e8b7c9f0a3d6e4b2c7f8a1d5e0b3c6a9f2d8e1b4c7}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24h
